<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 260" role="img" aria-labelledby="title desc">
  <title id="title">MorEcho logo</title>
  <desc id="desc">MorEcho wordmark inspired by Moroccan zellige, fez red, and green heritage motifs.</desc>
  <defs>
    <linearGradient id="red" x1="0" x2="1" y1="0" y2="1">
      <stop stop-color="#d82421"/>
      <stop offset="1" stop-color="#9e2119"/>
    </linearGradient>
    <linearGradient id="green" x1="0" x2="1" y1="0" y2="1">
      <stop stop-color="#5c7f2c"/>
      <stop offset="1" stop-color="#315f24"/>
    </linearGradient>
    <pattern id="zellige" width="38" height="38" patternUnits="userSpaceOnUse">
      <rect width="38" height="38" fill="#f3c26a"/>
      <path d="M19 1l6 12 12 6-12 6-6 12-6-12-12-6 12-6z" fill="#c33822"/>
      <path d="M0 0h38v38H0zM19 1v36M1 19h36" fill="none" stroke="#fff4d7" stroke-width="2"/>
      <path d="M1 1l36 36M37 1L1 37" stroke="#6c3b18" stroke-width="1.4" opacity=".75"/>
      <path d="M19 9l4 8 8 2-8 4-4 8-4-8-8-4 8-2z" fill="#587b34"/>
    </pattern>
    <pattern id="tealTiles" width="32" height="32" patternUnits="userSpaceOnUse">
      <rect width="32" height="32" fill="#00868b"/>
      <path d="M16 1l6 9 9 6-9 6-6 9-6-9-9-6 9-6z" fill="#0aa6a1"/>
      <path d="M2 2l28 28M30 2L2 30M16 1v30M1 16h30" stroke="#f4c66d" stroke-width="2"/>
      <circle cx="16" cy="16" r="3" fill="#7b431d"/>
    </pattern>
    <filter id="softShadow" x="-10%" y="-20%" width="120%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="7" flood-color="#203022" flood-opacity=".18"/>
    </filter>
  </defs>
  <rect width="980" height="260" fill="white"/>
  <g filter="url(#softShadow)">
    <text x="32" y="176" font-family="Segoe UI, Arial, sans-serif" font-size="156" font-weight="900" fill="url(#zellige)">M</text>
    <path d="M118 187c28-57 74-89 139-92v92z" fill="url(#red)"/>
    <text x="242" y="176" font-family="Segoe UI, Arial, sans-serif" font-size="156" font-weight="900" fill="url(#red)">or</text>
    <path d="M494 50c-72 0-130 50-130 111s58 111 130 111c45 0 84-19 107-49l-34-28c-15 20-42 33-73 33-45 0-82-30-82-67s37-67 82-67c31 0 58 13 73 33l34-28c-23-30-62-49-107-49zm0 36c49 0 89 34 89 75s-40 75-89 75-89-34-89-75 40-75 89-75z" fill="url(#green)"/>
    <text x="492" y="176" font-family="Segoe UI, Arial, sans-serif" font-size="156" font-weight="900" fill="url(#green)">Echo</text>
    <path d="M760 52c22 35 36 72 42 111h-42z" fill="url(#tealTiles)"/>
    <rect x="752" y="120" width="34" height="64" rx="5" fill="#efe6ce" stroke="#315f24" stroke-width="3"/>
    <path d="M769 76l29 45h-58z" fill="#efe6ce" stroke="#315f24" stroke-width="3"/>
    <path d="M762 141h14M762 157h14M762 173h14" stroke="#315f24" stroke-width="4" stroke-linecap="round"/>
  </g>
</svg>
